name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      # Retrieval quality gate that needs no cloud credentials
      - run: retail-rag eval-retrieval --offline -k 5 --min-recall 0.8

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # install only what Azure Functions will install, then load the app
      - name: Import the Functions app with its own requirements
        run: |
          python -m venv /tmp/fn && /tmp/fn/bin/pip install -q -r functions/requirements.txt
          ./functions/build.sh
          cd functions && /tmp/fn/bin/python -c "import function_app"

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and lint Bicep
        run: |
          az bicep install
          for f in infra/main.bicep infra/app.bicep; do
            az bicep build -f "$f" --stdout > /dev/null
            az bicep lint -f "$f"
          done

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t retail-rag-assistant:${{ github.sha }} .
      # start the image without dev dependencies and Azure settings: catches missing runtime deps
      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8000:8000 -e WARMUP_ON_STARTUP=false \
            retail-rag-assistant:${{ github.sha }}
          for i in $(seq 1 30); do curl -sf localhost:8000/health && exit 0; sleep 1; done
          docker logs api; exit 1
      # without the exporter a connection string is accepted but no trace leaves the container
      - name: Image can export to Application Insights
        run: |
          docker run --rm retail-rag-assistant:${{ github.sha }} \
            python -c "import azure.monitor.opentelemetry"

  # Optional: full LLM-judged evaluation against Azure, only when secrets are configured.
  eval-azure:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && vars.RUN_AZURE_EVAL == 'true'
    env:
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}
      AZURE_SEARCH_API_KEY: ${{ secrets.AZURE_SEARCH_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: retail-rag eval-retrieval -k 5 --min-recall 0.9
      - run: retail-rag eval --out reports/eval.json --min-pass-rate 0.9
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: reports/eval.json
