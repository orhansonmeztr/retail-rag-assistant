[project]
name = "retail-rag-assistant"
version = "0.1.0"
description = "RAG + tool-calling customer assistant for a retail product catalog and FAQ, built on Azure OpenAI and Azure AI Search."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.54",
    "azure-search-documents>=11.6.0",
    "azure-identity>=1.19",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "opentelemetry-api>=1.25",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "azure-functions>=1.21",
    "opentelemetry-sdk>=1.25",
]
monitor = ["azure-monitor-opentelemetry>=1.6"]
foundry-eval = ["azure-ai-evaluation>=1.0"]

[project.scripts]
retail-rag = "retail_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
